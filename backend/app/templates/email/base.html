<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject | default('Atlon HRMS') }}</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 0;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

      <!-- Header -->
      <tr>
        <td style="background:#1a56db;border-radius:8px 8px 0 0;padding:24px 32px;text-align:center;">
          <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.5px;">Atlon HRMS</span>
          {% if company_name %}
          <span style="color:#93c5fd;font-size:13px;display:block;margin-top:4px;">{{ company_name }}</span>
          {% endif %}
        </td>
      </tr>

      <!-- Body -->
      <tr>
        <td style="background:#ffffff;padding:32px;border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0;">
          {% block content %}{% endblock %}
        </td>
      </tr>

      <!-- Footer -->
      <tr>
        <td style="background:#f8fafc;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 8px 8px;padding:20px 32px;text-align:center;">
          <p style="margin:0;font-size:12px;color:#94a3b8;">
            This is an automated message from Atlon HRMS. Please do not reply to this email.
          </p>
          {% if company_name %}
          <p style="margin:8px 0 0;font-size:12px;color:#cbd5e1;">{{ company_name }}</p>
          {% endif %}
        </td>
      </tr>

    </table>
  </td></tr>
</table>
</body>
</html>
